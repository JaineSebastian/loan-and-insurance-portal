<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Personal Loan Calculator</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');

body{
  font-family: 'Inter', sans-serif;
  background:#f5f6f8;
}

/* COLORS */
:root{
  --gold:#c9a24d;
  --black:#0c0c0c;
}

/* TOP BAR */
.top-nav{
  background:#000;
  color:#fff;
  padding:10px 25px;
}

/* NAVBAR */
.navbar{
  background:#0c0c0c;
}
.navbar a{
  color:#fff!important;
  font-weight:500;
}
.navbar a:hover{
  color:var(--gold)!important;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#000,#1a1a1a);
  padding:90px 20px;
  color:white;
  text-align:center;
}
.hero h1{
  font-family:'Playfair Display', serif;
  letter-spacing:1px;
}

/* CARDS */
.emi-card, .emi-result{
  background:#fff;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 40px rgba(0,0,0,0.08);
  animation:fadeUp 1s ease;
}

.emi-result{
  border:2px solid var(--gold);
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

/* BUTTONS */
.btn-gold{
  background:var(--gold);
  border:none;
  color:#000;
  font-weight:600;
}
.btn-gold:hover{
  background:#b8923c;
}

/* FOOTER */
footer{
  background:#000;
  color:#fff;
  padding:30px;
  text-align:center;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-nav d-flex justify-content-between">
  <strong>Your Bank</strong>
  <span>Premium Banking Experience</span>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
<div class="container">
  <a class="navbar-brand text-gold" href="#">YourBank</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="nav">
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Loans</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Investments</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Cards</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Support</a></li>
    </ul>
  </div>
</div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Personal Loan Calculator</h1>
  <p class="mt-2">Luxury finance. Intelligent decisions.</p>
</section>

<!-- EMI SECTION -->
<div class="container my-5">
<div class="row g-4">

<div class="col-md-6">
  <div class="emi-card">
    <h5 class="mb-3">Loan Configuration</h5>

    <label>Loan Amount</label>
    <input type="range" id="loanAmt" min="500000" max="5000000" value="1000000">
    <p>₹ <span id="loanAmtVal"></span></p>

    <label>Tenure (Years)</label>
    <input type="range" id="loanTenure" min="1" max="7" value="5">
    <p><span id="loanTenureVal"></span> Years</p>

    <label>Interest Rate</label>
    <input type="range" id="loanRate" min="8" max="24" value="10" step="0.1">
    <p><span id="loanRateVal"></span>%</p>
  </div>
</div>

<div class="col-md-6">
  <div class="emi-result text-center">
    <h6>Monthly EMI</h6>
    <h1 class="fw-bold">₹ <span id="emiResult"></span></h1>

    <hr>

    <div class="d-flex justify-content-between">
      <span>Total Payable</span><strong>₹ <span id="totalPay"></span></strong>
    </div>
    <div class="d-flex justify-content-between">
      <span>Interest</span><strong>₹ <span id="intPay"></span></strong>
    </div>

    <a href="read.html" class="btn btn-gold w-100 mt-4">Read More</a>
  </div>
</div>

</div>
</div>

<!-- FOOTER -->
<footer>
© 2025 Your Bank · Luxury Financial Services
</footer>

<script>
function calculateEMI(){
let P=loanAmt.value;
let R=loanRate.value/12/100;
let N=loanTenure.value*12;
let emi=(P*R*Math.pow(1+R,N))/(Math.pow(1+R,N)-1);
let total=emi*N;

emiResult.innerText=Math.round(emi).toLocaleString();
totalPay.innerText=Math.round(total).toLocaleString();
intPay.innerText=Math.round(total-P).toLocaleString();

loanAmtVal.innerText=Number(P).toLocaleString();
loanTenureVal.innerText=loanTenure.value;
loanRateVal.innerText=loanRate.value;
}
document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calculateEMI));
calculateEMI();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
