<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You – Health Insurance Enquiry</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }

    .tick-container {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ffd700;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      animation: glow 2s ease-in-out infinite alternate;
    }

    .tick {
      width: 50px;
      height: 25px;
      border-left: 4px solid #ffd700;
      border-bottom: 4px solid #ffd700;
      transform: rotate(-45deg);
      opacity: 0;
      animation: drawTick 1.2s ease-out forwards 0.6s;
    }

    @keyframes drawTick {
      from { opacity: 0; transform: scale(0) rotate(-45deg); }
      to { opacity: 1; transform: scale(1) rotate(-45deg); }
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #ffd700; }
      to { box-shadow: 0 0 25px #ffd700; }
    }

    h1 {
      font-size: 2.4rem;
      margin: 0;
      color: #ffd700;
      animation: fadeIn 1.5s ease-in-out;
    }

    p {
      color: #ccc;
      margin-top: 10px;
      font-size: 1rem;
      max-width: 500px;
      animation: fadeIn 2.5s ease-in-out;
    }

    .btn-home {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 30px;
      background: #ffd700;
      color: #000;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
      animation: fadeIn 3.2s ease-in-out;
    }

    .btn-home:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="tick-container">
    <div class="tick"></div>
  </div>

  <h1>Thank You for Your Enquiry!</h1>
  <p>We’ve received your Enquiry. Our team will review your details and contact you shortly to assist further.</p>

  <a href="index.html" class="btn-home">Back to Home</a>

</body>
</html>
